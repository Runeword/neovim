name: "Build and Cache"
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: runeword-neovim
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build --accept-flake-config .
  # Stable-name gate for branch protection: the required-status context is
  # "check", which survives matrix changes. Pull requests always run it; the
  # push trigger's path filter only skips runs on main, where you push directly.
  check:
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - if: ${{ !contains(needs.*.result, 'success') || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
